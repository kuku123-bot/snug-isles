<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snug Isles</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A cozy two-player island crafting and building game for iPad and Mac.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snug Isles">
<meta name="theme-color" content="#3388dc">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Game view"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="touch" class="hidden"></div>
  <div id="ui"></div>
  <div id="toasts"></div>
  <div id="tip" class="hidden"></div>
  <div id="loading"><div class="load-card"><div class="load-title">Snug Isles</div><div class="load-bar"><i></i></div><div class="load-sub">Painting the islands…</div></div></div>
  <div id="rotate" class="hidden"><div>Turn your iPad sideways for the best view</div></div>
</div>
<noscript>This game needs JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
